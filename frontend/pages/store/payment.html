<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure payment — SRK Team Star</title>
    <link rel="shortcut icon" href="/assets/icons/SRK-Team-Star-Logos/primary.png" type="image/x-icon">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f8fafc; color: #12170f; font-family: Arial, sans-serif; }
        main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        section { max-width: 420px; text-align: center; background: #fff; border: 1px solid rgba(18,23,15,.1); border-radius: 12px; padding: 36px; box-shadow: 0 18px 50px rgba(18,23,15,.08); }
        .eyebrow { margin: 0 0 10px; color: #b48a13; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0 0 12px; font-size: 24px; }
        .message { margin: 0; color: #596054; font-size: 14px; line-height: 1.6; }
    </style>
    <link rel="stylesheet" href="/assets/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/styles/storefront-theme.css" media="screen">
</head>
<body data-razorpay-checkout data-srk-page="payment">
    <main id="payment-main">
        <section aria-live="polite">
            <p class="eyebrow">SRK Team Star</p>
            <h1>Preparing secure payment…</h1>
            <p class="message">Keep this tab open. Your checkout details remain safely available in the previous tab.</p>
        </section>
    </main>
</body>
</html>
